name: Java CI with Maven and Docker

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      # Budowanie wszystkich JARów za jednym razem
      - name: Build with Maven
        run: mvn -B clean install -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Konwersja nazwy repozytorium na małe litery (wymagane przez GHCR)
      - name: Lowercase repo name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # Budowanie i wypychanie każdego serwisu zdefiniowanego w docker-compose
      - name: Build and push Gateway Service
        uses: docker/build-push-action@v4
        with:
          context: ./gateway-service
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/gateway-service:latest

      - name: Build and push Auth Service
        uses: docker/build-push-action@v4
        with:
          context: ./auth-service
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/auth-service:latest

      - name: Build and push Contact Service
        uses: docker/build-push-action@v4
        with:
          context: ./contact-service
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/contact-service:latest

      - name: Build and push Audit Service
        uses: docker/build-push-action@v4
        with:
          context: ./audit-service
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/audit-service:latest

      - name: Build and push Notification Service
        uses: docker/build-push-action@v4
        with:
          context: ./notification-service
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/notification-service:latest