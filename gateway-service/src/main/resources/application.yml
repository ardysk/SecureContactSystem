server:
  port: 8000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/api/auth/**

        - id: contact-service
          uri: http://contact-service:8080
          predicates:
            - Path=/api/contacts/**

        - id: audit-service
          uri: http://audit-service:8083
          predicates:
            - Path=/api/audit/**

        - id: notification-service
          uri: http://notification-service:8081
          predicates:
            - Path=/api/email/**