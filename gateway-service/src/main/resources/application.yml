server:
  port: 8000  # Gateway wystawia się na porcie 8000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # --- Trasa do Auth Service ---
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**

        # --- Trasa do Contact Service ---
        - id: contact-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/contacts/**

        # --- Trasa do Audit Service (na przyszłość, np. dla Admina) ---
        - id: audit-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/audit/**

        # --- Trasa do Notification Service (opcjonalna, jeśli wystawia API) ---
        - id: notification-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/notifications/**